<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>totems</title>

  <!-- Your existing stylesheet: gives us the palette, Lexend, and .wrap -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Page-specific styles. Once you're happy, these can move into style.css -->
  <style>
    /* One column of totems, stacked top to bottom */
    .totems {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;               /* space between each totem */
      padding: 2rem 0 4rem;
      list-style: none;
      margin: 0;
    }

    /* Each image scales down to fit the screen, never up past its own size */
    .totems img {
      display: block;
      width: 100%;
      max-width: 400px;        /* change to suit your PNG size */
      height: auto;
    }

    /* Tiny hover cue so people know the image is clickable */
    .totems a:hover img,
    .totems a:focus-visible img {
      transform: scale(1.03);
    }
    .totems img {
      transition: transform 0.15s ease;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>Totems</h1>

    <!-- Each <li> is one totem: an image wrapped in a link to its audio file -->
    <ul class="totems">

      <li>
        <a href="audio/totem-01.mp3">
          <img src="images/totems/totem-01.png" alt="Totem 01">
        </a>
      </li>

      <li>
        <a href="audio/totem-02.mp3">
          <img src="images/totems/totem-02.png" alt="Totem 02">
        </a>
      </li>

      <li>
        <a href="audio/totem-03.mp3">
          <img src="images/totems/totem-03.png" alt="Totem 03">
        </a>
      </li>

      <!-- Copy a whole <li>...</li> block to add another totem -->

    </ul>

  </div>
</body>
</html>
